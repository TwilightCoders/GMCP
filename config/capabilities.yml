# Capability manifest for the GMCP MCP server.
#
# SOURCE OF TRUTH for what GMCP can do. GMCP::Capabilities loads from here, and
# spec/gmcp/capability_manifest_spec.rb asserts that every capability declared
# here is claimed by exactly the tools listed and vice versa — so the manifest
# cannot drift from the code without the suite going red. Capabilities should
# be declared by the connector, never inferred; a declaration that can drift is
# worse than an inference, because it reads as authoritative while being
# wrong. The drift spec is what makes this file a fact about the connector
# rather than a claim by it.
#
# A static file (rather than a tool) also lets a registration UI read what a
# connector COULD do without spawning it first.
#
# credential_source says where a connector's credential lives:
# local_file | keychain | delegated | none. GMCP's OAuth tokens are local_file,
# at ~/.config/gmcp/<account>/token.yaml. Voice is `delegated`: its session is
# held by an application GMCP does not run (Chrome), though GMCP picks the
# Chrome profile signed in as the requested account, so the principal is still
# constrained.
#
# ── account_scoping ────────────────────────────────────────────────────────
#
# One GMCP process serves several connectors, and they do not share account
# semantics. Each declares which it has:
#
#   enforced — GMCP_ACCOUNTS constrains which principal this connector reaches.
#              A grant's connector_account means what it says.
#
#   ignored  — GMCP_ACCOUNTS does NOT constrain this connector. The principal is
#              resolved at call time by something outside GMCP. A grant's
#              connector_account is DECORATIVE for it: it names an account that
#              constrains nothing.
#
# No connector is `ignored` today; the value stays so that one which cannot be
# scoped is forced to say so rather than look normal. The safety property of the grant model is that the account column always
# constrains; a connector that quietly violates that has to say so in a field a
# UI can read, not in a comment. Render an `ignored` grant as the principal it
# actually reaches, never as the account named on the row.

provider: gmcp

connectors:
  # ── the server itself ────────────────────────────────────────────────────
  - name: gmcp
    account_scoping: enforced
    credential_source: local_file
    description: GMCP's own administrative surface.
    capabilities:
      - name: gmcp.authorize
        description: >-
          Start the OAuth consent flow for a configured Google account. Opens a
          browser window on the machine running GMCP.
        tools: [gmcp_authorize]

  # ── Gmail ────────────────────────────────────────────────────────────────
  - name: gmail
    account_scoping: enforced
    credential_source: local_file
    description: Google Mail, per authorized account.
    capabilities:
      - name: gmail.read
        description: Search and read mail, and list labels. No mutation of any kind.
        tools: [gmail_search, gmail_get_message, gmail_list_labels,
                gmail_list_attachments, gmail_unsubscribe_info]

      - name: gmail.modify_labels
        description: >-
          Add and remove labels on a message. Archiving is included because in
          Gmail archiving IS removing the INBOX label — these tools reach labels
          and nothing else.
        tools: [gmail_archive_message, gmail_label_message,
                gmail_batch_archive, gmail_batch_modify]

      - name: gmail.trash
        description: Move a message to the trash. Separate from modify_labels because it is destructive.
        tools: [gmail_trash_message, gmail_batch_trash]

      - name: gmail.send
        description: >-
          Send mail out into the world, or stage it as a draft. The highest-risk
          capability here: the only one whose effects reach third parties.
        tools: [gmail_send, gmail_create_draft, gmail_reply]

      - name: gmail.download
        description: >-
          Write attachment bytes to a local directory. Separate from gmail.read
          because reading headers into a response is not the same act as
          creating files on the machine GMCP runs on.
        tools: [gmail_download_attachment]

      - name: gmail.unsubscribe
        description: >-
          Send an RFC 8058 one-click unsubscribe to the URL in a message's own
          List-Unsubscribe header. Separate because it leaves Google entirely
          and tells a third party the address is live.
        tools: [gmail_unsubscribe]

  # ── Calendar ─────────────────────────────────────────────────────────────
  - name: google_calendar
    account_scoping: enforced
    credential_source: local_file
    description: Google Calendar, per authorized account.
    capabilities:
      - name: calendar.read
        description: List calendars and read events. No mutation.
        tools: [calendar_list_calendars, calendar_list_events, calendar_get_event]

      - name: calendar.write
        description: >-
          Create and update events, and respond to invitations. RSVP is here
          rather than under read because it is visible to other attendees.
        tools: [calendar_create_event, calendar_update_event, calendar_rsvp]

      - name: calendar.delete
        description: Delete an event. Separate from write because it is destructive.
        tools: [calendar_delete_event]

  # ── Drive ────────────────────────────────────────────────────────────────
  - name: drive
    account_scoping: enforced
    credential_source: local_file
    description: Google Drive, per authorized account. Read-only; GMCP exposes no Drive writes.
    capabilities:
      - name: drive.read
        description: Search Drive, list folders, and read file contents.
        tools: [drive_search, drive_list_folder, drive_read_file]

  # ── Voice ────────────────────────────────────────────────────────────────
  - name: voice
    account_scoping: enforced
    credential_source: delegated
    description: >-
      Google Voice, per account. There is no usable OAuth path, so the session
      is read from the Chrome profile signed in as the requested account —
      found by email in Chrome's profile list, never by guessing — and an
      account with no such profile has no Voice. GMCP_ACCOUNTS constrains it
      like any other connector.
    capabilities:
      - name: voice.read
        description: >-
          List and search Voice messages, calls, and voicemail, and report an
          account's Voice number.
        tools: [voice_account, voice_list, voice_search]

      - name: voice.modify
        description: Mark a Voice thread read. Touches the read flag and nothing else.
        tools: [voice_mark_read]
